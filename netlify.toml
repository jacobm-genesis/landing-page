[build]
  command = "npm run build"
  publish = "out"

# The Google Maps browser key in utils/google-places.ts is public by design (it ships in client code and is
# restricted to genesishomebuyers.co and the Places + Maps JS APIs in Google Cloud), so Netlify's secrets
# scanner may ignore that one value while still scanning for real secrets.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyA3uBP0Lb4W3r9ereQ1IuQSk2yadQ2Cx98"

# Cache the hero video, poster, logo, and team photos for a week so returning visitors don't re-download them.
# If one of these files is replaced, give it a new name (or wait up to a week for browsers to refresh).
[[headers]]
  for = "/hero.*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/genesis-logo-web.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# "Save our number" contact card on /thank-you; text/vcard makes phones offer "Add to Contacts".
[[headers]]
  for = "/genesis-home-buyers.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=\"Genesis Home Buyers.vcf\""
