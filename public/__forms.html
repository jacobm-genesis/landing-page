<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Genesis offer form definition</title>
  </head>
  <body>
    <!-- Netlify detects this static definition when deploying Next.js. Keep field names in sync with components/ui/home-page.tsx. -->
    <form name="offer" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="offer" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" required />
      <input name="email" type="email" required />
      <input name="phone" type="tel" required />
      <input name="address" type="text" required />
      <input name="address_street" type="hidden" />
      <input name="address_city" type="hidden" />
      <input name="address_state" type="hidden" />
      <input name="address_zip" type="hidden" />
      <input name="address_place_id" type="hidden" />
      <input name="sms_consent_transactional" type="checkbox" value="yes" />
      <input name="sms_consent_marketing" type="checkbox" value="yes" />
      <input name="zillow_link" type="hidden" />
      <input name="lead_source" type="hidden" />
      <input name="utm_source" type="hidden" />
      <input name="utm_medium" type="hidden" />
      <input name="utm_campaign" type="hidden" />
      <input name="utm_term" type="hidden" />
      <input name="gclid" type="hidden" />
      <input name="landing_page" type="hidden" />
      <input name="referrer" type="hidden" />
    </form>
    <!-- Optional second step after an offer request; keep in sync with components/ui/offer-details-form.tsx. -->
    <form name="offer-details" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="offer-details" />
      <input name="bot-field" type="text" />
      <input name="name" type="hidden" />
      <input name="email" type="hidden" />
      <input name="phone" type="hidden" />
      <input name="address" type="hidden" />
      <input name="zillow_link" type="hidden" />
      <input name="reason" type="radio" value="" />
      <input name="condition" type="radio" value="" />
      <input name="timeline" type="radio" value="" />
      <input name="occupancy" type="radio" value="" />
      <input name="repairs" type="text" />
      <input name="asking_price" type="text" />
      <input name="details_notes" type="text" />
    </form>
    <!-- Deal-under-contract submissions from app/jv/page.tsx; keep in sync with components/ui/jv-deal-form.tsx. -->
    <form name="jv-deal" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="jv-deal" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" required />
      <input name="phone" type="tel" required />
      <input name="email" type="email" required />
      <input name="property_address" type="text" required />
      <input name="address_street" type="hidden" />
      <input name="address_city" type="hidden" />
      <input name="address_state" type="hidden" />
      <input name="address_zip" type="hidden" />
      <input name="address_place_id" type="hidden" />
      <input name="deal_type" type="text" />
      <input name="contract_price" type="text" required />
      <input name="asking_price" type="text" />
      <input name="arv" type="text" />
      <input name="repairs" type="text" />
      <input name="contract_close_date" type="text" required />
      <input name="photos_link" type="text" />
      <input name="notes" type="text" />
      <input name="lead_source" type="hidden" />
      <input name="utm_source" type="hidden" />
      <input name="utm_medium" type="hidden" />
      <input name="utm_campaign" type="hidden" />
      <input name="utm_term" type="hidden" />
      <input name="gclid" type="hidden" />
      <input name="landing_page" type="hidden" />
      <input name="referrer" type="hidden" />
    </form>
  </body>
</html>
